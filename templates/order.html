<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body {
            background-color: rgba(0, 0, 0, 0.412);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            max-width: 600px;
            border-radius: 10px;
            padding-top: 0px;
            margin-top: 30px;
            font-family: 'Times New Roman', Times, serif;
        }

        .card {
            width: 600px;
            background-color: white;
            border-radius: 15px;
            padding: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        label {
            font-size: 20px;
        }

        input:hover {
            border-bottom: 2px solid black;
        }

        @media (max-width: 480px) {
            .card {
                width: 100%;
                max-width: 350px;
            }
        }


        #payment {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <p>{{msg}}</p>
            <form action="/order" method="POST">
                <h1 style="text-align: center;">ORDER NOW</h1>
                {% csrf_token %}

                <div class="row">
                    <div class="col-6">
                        <label for="firstname" class="form-label">Firstname</label><br>
                        <input type="text" id="firstname" name="firstname" class="form-control"><br>
                    </div>
                    <div class="col-6">
                        <label for="lastname" class="form-label">Lastname</label><br>
                        <input type="text" id="lastname" name="lastname" class="form-control"><br>
                    </div>
                </div>

                <div class="row">
                    <div class="col-6">
                        <label for="email" class="form-label">Email</label><br>
                        <input type="email" id="email" name="email" class="form-control"><br>
                    </div>
                    <div class="col-6">
                        <label for="contact" class="form-label">Contact</label><br>
                        <input type="tel" id="contact" name="contact" class="form-control"><br>
                    </div>
                </div>

                <label for="address" class="form-label">Address</label><br>
                <input type="text" id="address" name="address" class="form-control"><br>

                <label for="total_dishes" class="form-label">Total Dishes</label><br>
                <ol>
                    {% for i in dish %}
                    <li>{{i.dish_name}}</li>
                    {% endfor %}
                </ol>

                <label for="price" class="form-label">Total Price</label><br>
                <input type="text" id="price" name="price" value="{{total}}" class="form-control" required readonly><br>

                <label for="payment">Payment By</label><br>
                <select id="payments" name="payment" class="form-select" onchange="html()">
                    <option value="select">select your payment method</option>
                    <option value="cod" name="payment">Cash on delivery</option>
                    <option value="creditcard" name="payment">Credit Card</option>
                </select>

                <div id="payment">
                    <label for="" class="form-label">Enter Card Number</label>
                    <input type="number" name="card_number" class="form-control">

                    <div class="row">
                        <div class="col">
                            <label for="" class="form-label">CVV</label>
                            <input type="number" name="cvv" class="form-control">
                        </div>
                        <div class="col">
                            <label for="" class="form-label">Expiry Date</label>
                            <input type="date" name="expiry_date" class="form-control">
                        </div>
                    </div>
                </div>
                <br><br>
                <button type="submit" class="btn fs-5 btn-outline-primary w-25">Submit</button>
                <a href="/home"><button type="button" class="btn btn-outline-dark fs-5 w-25">Back</button></a>
            </form>
        </div>

    </div>
    <script>
        function html() {
            d = document.getElementById("payments").value;
            alert("you select "+d);
            if(d == "creditcard"){

                document.getElementById("payment").style.display = "block";
            }

        }
        </script>
</body>

</html>
