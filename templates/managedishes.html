<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
    <div class="container" style="font-family:'Times New Roman', Times, serif;">
        <table class="table table-striped table-responsive table-hover mt-5">
            <tr style="text-align: center;">
                
                <th style="background-color:rgba(153, 51, 124, 0.421);">Sr. no.</th>
                <th style="background-color:rgba(153, 51, 124, 0.421);">Dish Name</th>
                <th style="background-color:rgba(153, 51, 124, 0.421);">Dish Category</th>
                <th style="background-color:rgba(153, 51, 124, 0.421);">Dish Description</th>
                <th style="background-color:rgba(153, 51, 124, 0.421);">Image</th>
                <th style="background-color:rgba(153, 51, 124, 0.421);">Offer Price</th>
                <th style="background-color:rgba(153, 51, 124, 0.421);">Actual Price</th>
                <th colspan="2" style="background-color:rgba(153, 51, 124, 0.421);">Actions</th>
               
            </tr>

            {% for i in data %}
            <tr style="text-align: center;">
                
                <td>{{i.id}}</td>
                <td>{{i.dish_name}}</td>
                <td>{{i.dish_category}}</td>
                <td>{{i.dish_description}}</td>
                <td> <img src="{{i.image.url}}" alt="img" height="50px" width="50px"></td>
                <td>&#8377;{{i.offer_price}}</td>
                <td>&#8377;{{i.actual_price}}</td>
                
                <td><a href="/delete/{{i.id}}"><button type="button" class="btn btn-outline-danger">Delete</button></a></td>
                <td><a href="/edit/{{i.id}}"><button type="button" class="btn btn-outline-success">Edit</button></a></td>
            
            </tr>
            {% endfor %}
        </table>
    </div>
    <a href="/admindashboard"><button type="button" class="btn btn-outline-dark float-end mx-5 fs-5">Back</button></a>
</body>
</html>
