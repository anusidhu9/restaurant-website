<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body{
            background-color: rgba(0, 0, 0, 0.412);
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            max-width:600px;
            border-radius: 10px;
            padding-top: 0px;
            margin-top: 50px;
            font-family: 'Times New Roman', Times, serif;
        }
  
        .card {
            width: 600px;
            background-color: white;
            border-radius: 15px;
            padding: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        label{
            font-size:20px;
        }
        input:hover{
            border-bottom: 2px solid  black;
        }
        @media (max-width: 480px) {
            .card {
            width: 100%;
            max-width: 350px;
            }
        }
        
    </style>
</head>
<body>
   
    <div class="container">
        <div class="card">
        <p>{{msg}}</p>
    <form action="/submit" method="POST">
        <h1 style="text-align: center;">SIGN UP HERE!</h1>
        {% csrf_token %}
        
                <label for="username" class="form-label">Username</label><br>
                <input type="text" id="username" name="username"  class="form-control"><br>
          
        <div class="row">
            <div class="col-6">
                <label for="firstname" class="form-label">Firstname</label><br>
                <input type="text" id="firstname" name="firstname"  class="form-control"><br>
            </div>
            <div class="col-6">
                <label for="lastname" class="form-label">Lastname</label><br>
                <input type="text" id="lastname" name="lastname"  class="form-control"><br>
            </div>
        </div>

        <label for="email" class="form-label">Email</label><br>
        <input type="email" id="email" name="email"  class="form-control"><br>

        <div class="row">
        <div class="col-6">
            <label for="password" class="form-label">Password</label><br>
            <input type="password" id="password" name="password"  class="form-control"><br>
        </div>
        <div class="col-6">
            <label for="confirm_password" class="form-label">Confirm Password</label><br>
            <input type="password" id="confirm_password" name="confirm_password"  class="form-control"><br>
        </div>
        </div>
        <button type="submit" class="btn fs-5 btn-outline-primary w-25">Submit</button>
        <a href="/home"><button type="button" class="btn btn-outline-dark fs-5 w-25">Back</button></a>
    </form>
</div>

</div>
  

</body>
</html>
