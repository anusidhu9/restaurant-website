<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body{
            background-color: rgba(0, 0, 0, 0.412);
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            max-width:600px;
            border-radius: 10px;
            padding-top: 0px;
            margin-top: 50px;
            font-family: 'Times New Roman', Times, serif;
        }
  
        .card {
            width: 600px;
            background-color: white;
            border-radius: 15px;
            padding: 10px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        label{
            font-size:20px;
        }
        input:hover{
            border-bottom: 2px solid  black;
        }
        @media (max-width: 480px) {
            .card {
            width: 100%;
            max-width: 350px;
            }
        }
        
    </style>
</head>
<body>
   
    <div class="container">
        <div class="card">
        <p>{{msg}}</p>
    <form action="/adddishes" method="POST" enctype="multipart/form-data">
        <h1 style="text-align: center;">ADD DISH</h1>
        {% csrf_token %}
        
                <label for="dish_name" class="form-label">Dish Name</label><br>
                <input type="text" id="dish_name" name="dish_name"  class="form-control"><br>
          
        <div class="row">
            <div class="col-6">
                <label for="dish_category" class="form-label">Dish Category</label><br>
                <input type="text" id="dish_category" name="dish_category"  class="form-control"><br>
            </div>
            <div class="col-6">
                <label for="dish_description" class="form-label">Dish Description</label><br>
                <input type="text" id="dish_description" name="dish_description"  class="form-control"><br>
            </div>
        </div>

        <label for="image" class="form-label">Image</label><br>
        <input type="file" id="image" name="image"  class="form-control"><br>

       <div class="row">
        <div class="col-6">
            <label for="offer_price" class="form-label">Offer Price</label><br>
            <input type="offer_price" id="offer_price" name="offer_price"  class="form-control"><br>    
        </div>
       
        <div class="col-6">
            <label for="actual_price" class="form-label">Actual Price</label><br>
            <input type="actual_price" id="actual_price" name="actual_price"  class="form-control"><br>
        </div>
        </div>

       
        <button type="submit" class="btn fs-5 btn-outline-primary w-25">Submit</button>
        <a href="/admindashboard"><button type="button" class="btn fs-5 btn-outline-success w-25">Back</button></a>
    </form>
</div>

</div>
  

</body>
</html>
