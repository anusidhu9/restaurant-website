<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>
    <div class="container" style="font-family: 'Times New Roman', Times, serif;">
        <table class="table table-striped table-responsive table-hover mt-5 ">
            <tr style="text-align: center;">
               
        <th style="background-color: rgba(255, 105, 180, 0.503);">Sr. no.</th>
        <th style="background-color: rgba(255, 105, 180, 0.503);">First Name</th>
        <th style="background-color: rgba(255, 105, 180, 0.503);">Last Name</th>
        <th style="background-color: rgba(255, 105, 180, 0.503);">Email</th>
        <th style="background-color: rgba(255, 105, 180, 0.503);">Contact</th>
        <th style="background-color: rgba(255, 105, 180, 0.503);">Address</th>
        <th style="background-color: rgba(255, 105, 180, 0.503);">Total Dishes</th>
        <th style="background-color: rgba(255, 105, 180, 0.503);">Total Price</th>
        <th style="background-color: rgba(255, 105, 180, 0.503);">Payment by</th>
        <th style="background-color: rgba(255, 105, 180, 0.503);">Status</th>
       

            </tr>

            {% for i in data %}
            <tr style="text-align: center;">

                <td>{{i.id}}</td>
                <td>{{i.firstname}}</td>
                <td>{{i.lastname}}</td>
                <td>{{i.email}}</td>
                <td>{{i.contact}}</td>
                <td>{{i.address}}</td>
                <td>{{i.total_dishes}}</td>
                <td>&#8377;{{i.total_pr}}</td>
                <td>{{i.payment}}</td>
                <td>{{i.status}}</td>
                </tr>
                {% endfor %}

        </table>
    </div>
    <a href="/home"><button type="button" class="btn btn-outline-dark float-end mx-5 fs-5">Back</button></a>
</body>

</html>
